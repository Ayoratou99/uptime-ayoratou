services:
  ayoratou:
    container_name: ayoratou
    # Builds from this repo so local changes (including the rebranded frontend
    # in ./dist) are baked into the image. Run `npm run build` first.
    build:
      context: .
      dockerfile: docker/dockerfile
      target: release
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    ports:
      # <Host Port>:<Container Port>
      - "3001:3001"
