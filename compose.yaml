services:
  uptime-ayoratou:
    container_name: uptime-ayoratou
    image: ayoratou99/uptime-ayoratou:latest
    # Builds from this repo so local changes (including the frontend in ./dist)
    # are baked into the image. Run `npm run build` first.
    # Drop the `build:` block to run the published image instead.
    build:
      context: .
      dockerfile: docker/dockerfile
      target: release
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    ports:
      # <Host Port>:<Container Port>
      - "3001:3001"
