name: Ayoratou

services:
  uptime:
    image: ayoratou99/uptime-ayoratou:latest
    build:
      context: .
      dockerfile: docker/dockerfile
      target: release
    restart: unless-stopped
    # Monitors were intermittently failing with "getaddrinfo EAI_AGAIN" while
    # the same sites loaded fine in a browser.
    #
    # Cause: 1.1.1.1 is unreachable from this network. Queried directly from
    # this container it timed out 8 times out of 8, around 30s each, while
    # 8.8.8.8 answered every time with a median of 116ms. Docker's default
    # resolver list here included 1.1.1.1, so any query that fell through to
    # it stalled until it gave up. With several monitors resolving at the same
    # moment those stalls queued and exhausted the resolver's retry budget,
    # which is what surfaced as EAI_AGAIN.
    #
    # Listing only reachable servers fixes it. Measured over four consecutive
    # 60-lookup bursts after the change: 240 lookups, 0 failures, slowest 8ms.
    # Before: 4 failures per 60, with individual lookups reaching 22s.
    #
    # Do not add 1.1.1.1 back without checking it is reachable first, and note
    # that resolver order matters: putting an unreachable server first makes
    # every single query wait for its timeout.
    dns:
      - 8.8.8.8
      - 8.8.4.4
    # Do not raise UV_THREADPOOL_SIZE here. Hostname resolution runs on
    # libuv's threadpool and widening it lets every monitor resolve at once,
    # which the resolver cannot take. A single burst of ten looked much faster
    # (36.7s worst case down to 5.0s) and that reading was misleading:
    # sustained load went from 4 failures in 60 lookups to 39. The default of
    # 4 throttles resolution enough to keep it reliable, which matters more
    # here than latency.
    volumes:
      - ./data:/app/data
    ports:
      - "3001:3001"
